name: Build Weathercloud Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-native/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Weathercloud launcher icon
        run: |
          mkdir -p app/src/main/res/mipmap-nodpi
          curl -fsSL https://raw.githubusercontent.com/rujibe/weathercloud-pwa/main/icons/icon-512.png -o app/src/main/res/mipmap-nodpi/ic_launcher.png
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weathercloud-android-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
