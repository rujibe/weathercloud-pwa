name: Actualizar datos de Weathercloud

on:
  schedule:
    - cron: "13 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publicar-web
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar la conexión con Weathercloud
        run: pip install -r requirements.txt
      - name: Obtener los datos de las estaciones
        run: python fetch_weather.py
      - name: Obtener el histórico de los sensores
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '13 3 * * *')
        run: python fetch_history.py
      - name: Guardar el histórico en el repositorio
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '13 3 * * *')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar histórico meteorológico"
            git push
          fi
      - name: Preparar los archivos de la web
        run: |
          mkdir _site
          cp -r index.html api-config.js stations.json weather.json manifest.webmanifest sw.js icons _site/
          if [ -f history.json ]; then cp history.json _site/; fi
          touch _site/.nojekyll
      - name: Preparar publicación de GitHub Pages
        uses: actions/configure-pages@v5
      - name: Guardar la web lista para publicar
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
